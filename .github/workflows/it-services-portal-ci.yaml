name: IT Services Portal CI

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  checkout:

    name: Checkout
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Upload Workspace
        uses: actions/upload-artifact@v4
        with:
          name: source-code
          path: .

  compile:

    name: Compile
    runs-on: ubuntu-latest
    needs: checkout

    steps:

      - name: Download Source Code
        uses: actions/download-artifact@v4
        with:
          name: source-code

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Maven Cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Compile Application
        run: mvn clean compile

      - name: Upload Compiled Workspace
        uses: actions/upload-artifact@v4
        with:
          name: compiled-workspace
          path: .

  checkstyle:

    name: Checkstyle
    runs-on: ubuntu-latest
    needs: compile

    steps:

      - name: Download Compiled Workspace
        uses: actions/download-artifact@v4
        with:
          name: compiled-workspace

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Checkstyle
        run: mvn checkstyle:checkstyle

      - name: Upload Checkstyle Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml

  unit-test:

    name: Unit Test
    runs-on: ubuntu-latest
    needs: compile

    steps:

      - name: Download Compiled Workspace
        uses: actions/download-artifact@v4
        with:
          name: compiled-workspace

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Unit Tests
        id: unit-tests
        run: mvn test

      - name: Add Unit Test Summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.unit-tests.outcome }}
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          reports = sorted(glob.glob("target/surefire-reports/TEST-*.xml"))
          summary = ["## Unit test results", "", f"Test command: **{os.environ['TEST_OUTCOME']}**", ""]

          if reports:
              totals = {key: 0 for key in ("tests", "failures", "errors", "skipped")}
              for report in reports:
                  root = ET.parse(report).getroot()
                  suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
                  for suite in suites:
                      for key in totals:
                          totals[key] += int(suite.get(key, "0"))

              summary.extend([
                  "| Tests | Passed | Failures | Errors | Skipped |",
                  "| ---: | ---: | ---: | ---: | ---: |",
                  f"| {totals['tests']} | {totals['tests'] - totals['failures'] - totals['errors'] - totals['skipped']} | {totals['failures']} | {totals['errors']} | {totals['skipped']} |",
              ])
          else:
              summary.append("No Surefire XML reports were generated.")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(summary) + "\n")
          PY

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          path: target/surefire-reports/

      - name: Upload Tested Workspace
        uses: actions/upload-artifact@v4
        with:
          name: tested-workspace
          path: .

  coverage:

    name: Code Coverage
    runs-on: ubuntu-latest
    needs: unit-test

    steps:

      - name: Download Tested Workspace
        uses: actions/download-artifact@v4
        with:
          name: tested-workspace

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate JaCoCo Coverage
        run: mvn jacoco:report

      - name: Add Coverage Summary
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("target/site/jacoco/jacoco.xml")
          summary = ["## Code coverage", ""]

          if report.is_file():
              root = ET.parse(report).getroot()
              summary.extend([
                  "| Metric | Coverage | Visual |",
                  "| --- | ---: | --- |",
              ])
              for metric, label in (("LINE", "Lines"), ("BRANCH", "Branches")):
                  counter = root.find(f"counter[@type='{metric}']")
                  if counter is None:
                      continue
                  missed = int(counter.get("missed", "0"))
                  covered = int(counter.get("covered", "0"))
                  total = missed + covered
                  if total == 0:
                      value, bar = "N/A", "N/A"
                  else:
                      percent = covered * 100 / total
                      filled = round(percent / 5)
                      value = f"{percent:.1f}%"
                      bar = f"`{'#' * filled}{'.' * (20 - filled)}`"
                  summary.append(f"| {label} | {value} | {bar} |")
              summary.extend(["", "The downloadable `jacoco-coverage-report` artifact includes the full HTML report."])
          else:
              summary.append("JaCoCo XML report was not generated.")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(summary) + "\n")
          PY

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: |
            target/site/jacoco/
            target/site/jacoco/jacoco.xml

  package:

    name: Package
    runs-on: ubuntu-latest
    needs:
      - checkstyle
      - coverage

    steps:

      - name: Download Tested Workspace
        uses: actions/download-artifact@v4
        with:
          name: tested-workspace

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Package Application
        run: mvn package -DskipTests

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-artifacts
          path: |
            target/*.jar
            target/*.war

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/it-services-portal:latest
            ${{ secrets.DOCKER_USERNAME }}/it-services-portal:${{ github.run_number }}
